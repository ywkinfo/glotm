name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run health:runtime
        run: npm run health:runtime

      - name: Run health:content
        run: npm run health:content

      - name: Run health:release
        run: npm run health:release

      # 아래 두 감사는 지금까지 어느 워크플로에도 없어 owner가 손으로 돌릴 때만 결과가 보였다.
      # check:consistency 는 registry↔문서 drift를 hard/advisory 로 가르고,
      # audit:facts 는 워크스페이스별 claim 상태(gate=pass/warn/fail)와 staleHighRisk 를 출력한다.
      # audit:facts 는 스키마·사실무결성 오류에서는 exit 1 로 실패하고, claim staleness 는
      # warning 이라 exit 0 을 유지한다(문서상 fact-review 는 advisory·non-gating 트랙).
      # 즉 이 스텝은 staleness 를 붉히지 않고 로그로만 남긴다. 그 정책을 바꾸려면 owner 판단이 필요하다.
      - name: Run check:consistency
        run: npm run check:consistency

      - name: Run audit:facts (advisory)
        run: npm run audit:facts

      # 브리프 소재 발굴 lane의 advisory 스냅샷(cadence 경과일·백로그·커버리지 공백·미실사 소스).
      # audit:facts staleness 와 같이 지표로는 붉히지 않고 로그로만 남긴다.
      # 정확히: **지표는 종료 코드를 바꾸지 않지만, 스크립트 실행 실패(데이터 로드 불가 등)는
      # 여전히 이 스텝을 실패시킨다.** 하나는 운영 신호이고 하나는 하네스 고장이다.
      # 구조 위반(존재하지 않는 소스 id, 발행 이슈와 안 맞는 후보 등)은 위 health:runtime 안의
      # `brief discovery contract` 가 이미 게이트한다. cadence 를 하드 게이트로 올리려면
      # docs/briefs-lane.md 의 "hard SLA 없음" 계약부터 owner 가 고쳐야 한다.
      # 이 스텝은 주기 트리거가 아니다 — 실제 주기는 월간 리뷰와 phase2.5 런북 §5 가 담당한다.
      - name: Run briefs:radar (advisory)
        run: npm run briefs:radar
